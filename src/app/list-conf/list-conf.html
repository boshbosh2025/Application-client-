<div class="conference-page">
  <div class="search-bar-wrap">
    <input
      type="text"
      [(ngModel)]="searchTerm"
      class="search-input"
      placeholder="Rechercher une conférence..."
      aria-label="Recherche conférence"
    />
  </div>

  <div class="conference-container">
    @for (conf of filteredConferences; track conf.title) {
      <div class="conference-card">
        <img [src]="conf.picture" [alt]="conf.title" class="conf-img" />

        <div class="conf-details">
          <h3>{{ conf.title }}</h3>

          <div class="detail-item">
            <span class="label">Date</span>
            <span>{{ conf.date }}</span>
          </div>

          <div class="detail-item">
            <span class="label">Adresse</span>
            <span>{{ conf.adress }}</span>
          </div>

          <div class="availability-block">
            <div class="availability">
              <span class="label">Available_Places</span>

              @if (conf.available_Places > 0) {
                <span class="badge-dispo">
                  {{ conf.available_Places }} places
                </span>
              } @else {
                <span class="badge-complet">Complet</span>
              }
            </div>

            <button
              type="button"
              class="participate-btn"
              [disabled]="conf.available_Places === 0"
              (click)="participate(conf)">
              {{ conf.available_Places === 0 ? 'Complet' : 'Participate' }}
            </button>
          </div>
        </div>
      </div>
    }
  </div>

  @if (filteredConferences.length === 0) {
    <div class="no-result">
      Aucune conférence trouvée.
    </div>
  }
</div>
